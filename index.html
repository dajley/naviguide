<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>NaViGuide</title>
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<main>
			<div class="stage">
				<video id="camera" playsinline muted autoplay></video>
				<canvas id="overlay"></canvas>
			</div>
			<p id="status" role="status" aria-live="polite">Tap Start to begin.</p>
			<button id="toggle" type="button">Start</button>
		</main>
		<script>
			window.onerror = (msg) => {
				document.getElementById("status").textContent = "Error: " + msg;
			};
			window.addEventListener("unhandledrejection", (e) => {
				document.getElementById("status").textContent = "Error: " + e.reason;
			});
		</script>
		<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
		<script type="module" src="js/main.js"></script>
	</body>
</html>
